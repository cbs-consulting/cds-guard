name: Release
# Publishes a tested commit to npm and creates a GitHub release with the version's CHANGELOG.md
# entry. Started by hand from the Actions tab; nothing is published until a maintainer approves the
# "npm" environment.
#
# npm accepts the upload because this workflow is the package's trusted publisher (npmjs.com ->
# cds-guard -> Settings -> Trusted publishing: cbs-consulting/cds-guard, workflow release.yml,
# environment npm), so no npm token is stored here. The first publish has to be done by hand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release
        default: main
      dry_run:
        description: Only run the checks and the build, publish nothing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund && npm test && npm pack --dry-run
      - name: Check that this commit may be released
        id: check
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p 'require("./package.json").version')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if ! grep -Eq "^## $VERSION - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry '## $VERSION - YYYY-MM-DD'. Rename 'Unreleased' to it before releasing."
            exit 1
          fi
          if npm view "cds-guard@$VERSION" version >/dev/null 2>&1; then
            echo "::error::cds-guard $VERSION is already on npm. Raise the version."
            exit 1
          fi

  publish:
    needs: check
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$SHA" --title "cds-guard $VERSION" --notes-file notes.md
